name: Import GROL5000 graphics

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/import-grolgfx.yml

permissions:
  contents: write

jobs:
  import-gfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Download GROL5000 icon masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p GrolGFX/icons

          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537087182/3634152309.png?token=exp=1790553600~hmac=d8a8bb80452f7de7a678512e7143c2ca8121d4e71c3a4cd4dea8656fae205afc' -o GrolGFX/icons/system.png
          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537087575/3634152492.png?token=exp=1790553600~hmac=af5f124cdce90df12e78e3e9e189a4954ccadfc3533095abef94c55f1890b2a7' -o GrolGFX/icons/appearance.png
          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537087976/3634152665.png?token=exp=1790553600~hmac=9be086cfeb3044b707fbb3fc7f58cd2ec26fb7268456f6d5efb6aa6fff9d8e9e' -o GrolGFX/icons/dark-theme.png
          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537088425/3634152859.png?token=exp=1790553600~hmac=2b942d07ec5cd80f32576d2a933beed3f74dc0ec8a7cff0c541e64f4523f8725' -o GrolGFX/icons/light-theme.png
          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537088856/3634153046.png?token=exp=1790553600~hmac=6e7e78e48fae23d9fcde9857565526d97773638f59b29d18c93411ce9dcb54da' -o GrolGFX/icons/wide-theme.png
          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537100604/3634158439.png?token=exp=1790553600~hmac=556db19268497abda6f144532c61f96e642901577c5c9aeb634c7abf5e2ae52b' -o GrolGFX/icons/boot.png
          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537101132/3634158641.png?token=exp=1790553600~hmac=35190efc7db01c094e8df67218088b468cb8ca5499f4e5e36d468317c0ff380c' -o GrolGFX/icons/updates.png
          curl -L --fail --retry 3 'https://pikaso.cdnpk.net/private/production/5537101580/3634158815.png?token=exp=1790553600~hmac=2cd996e81127ed9d11bb64f66e59d4ba5ddc60f3f5cdda8e2949c0da180ba9b1' -o GrolGFX/icons/security.png

          file GrolGFX/icons/*.png
          test "$(find GrolGFX/icons -maxdepth 1 -name '*.png' | wc -l)" -eq 8

      - name: Commit graphics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GROL5K Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add GrolGFX/icons
          if git diff --cached --quiet; then
            echo "No graphics changes to commit."
            exit 0
          fi
          git commit -m "assets: add initial GROL5000 system icon set"
          git push origin HEAD:dev
