name: GROL foundation guardrails

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Validate GROL foundation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Run GROL guardrails
        run: bash scripts/grol/check-foundation.sh
