name: Retest GROL OVA artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: OS build run ID containing the QCOW2 artifact
        required: true
        type: string
      version:
        description: Development version embedded in artifact name (for example 18.4.dev1790176743)
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Retest in QEMU
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout current test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y qemu-system-x86 ovmf

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install Python requirements
        run: pip install -r tests/requirements.txt

      - name: Download QCOW2 artifact from prior OS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haos_ova-${{ inputs.version }}.qcow2.xz
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract OS image
        run: |
          xz -dc haos*.qcow2.xz > tests/haos.qcow2
          rm haos*.qcow2.xz

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests
        run: ./tests/run_tests.sh --durations=0 --durations-min=5.0

      - name: Archive logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: retest-logs
          path: tests/lg_logs/**

      - name: Archive JUnit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: retest-junit-reports
          path: tests/junit_reports/*.xml

      - name: Publish test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: 'tests/junit_reports/*.xml'
          annotate_only: true
          detailed_summary: true
